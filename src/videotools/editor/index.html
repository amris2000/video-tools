<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Config Editor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    h1 {
      margin-top: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    button,
    .file-label {
      border: 0;
      border-radius: 6px;
      padding: 10px 16px;
      font: inherit;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button.secondary {
      background: #666;
    }

    button.danger {
      background: #b3261e;
    }

    input[type="file"] {
      display: none;
    }

    .section {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .field {
      margin-bottom: 16px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font: inherit;
    }

    .clip {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .clip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .clip-header h3 {
      margin: 0;
      font-size: 16px;
    }

    .clip-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 2fr;
      gap: 12px;
    }

    .clip-grid .field {
      margin: 0;
    }

    .empty {
      color: #777;
      padding: 20px 0;
      text-align: center;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      color: #555;
      font-size: 14px;
    }

    @media (max-width: 800px) {
      .clip-grid {
        grid-template-columns: 1fr;
      }

      .status {
        width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Video Config Editor</h1>

    <div class="toolbar">
      <label class="file-label">
        Upload JSON
        <input id="fileInput" type="file" accept=".json,application/json" />
      </label>

      <button id="newButton" class="secondary">New Config</button>
      <button id="addClipButton">Add Clip</button>
      <button id="downloadButton">Download JSON</button>

      <div id="status" class="status">No file loaded</div>
    </div>

    <div class="section">
      <div class="field">
        <label for="version">Version</label>
        <input id="version" type="number" value="1" />
      </div>

      <div class="field">
        <label for="output">Output filename</label>
        <input
          id="output"
          type="text"
          value="selected-video.mp4"
          placeholder="selected-video.mp4"
        />
      </div>
    </div>

    <div class="section">
      <h2>Clips</h2>
      <div id="clips"></div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const versionInput = document.getElementById("version");
    const outputInput = document.getElementById("output");
    const clipsContainer = document.getElementById("clips");
    const status = document.getElementById("status");

    let originalFilename = "video-config.json";

    function createEmptyConfig() {
      return {
        version: 1,
        output: "selected-video.mp4",
        clips: []
      };
    }

    function readConfigFromPage() {
      const clips = [...document.querySelectorAll(".clip")].map((clip) => {
        return {
          file: clip.querySelector('[data-field="file"]').value,
          start: Number(clip.querySelector('[data-field="start"]').value),
          end: Number(clip.querySelector('[data-field="end"]').value),
          label: clip.querySelector('[data-field="label"]').value
        };
      });

      return {
        version: Number(versionInput.value),
        output: outputInput.value,
        clips
      };
    }

    function loadConfig(config) {
      versionInput.value = config.version ?? 1;
      outputInput.value = config.output ?? "selected-video.mp4";

      clipsContainer.innerHTML = "";

      const clips = Array.isArray(config.clips) ? config.clips : [];

      clips.forEach(addClip);

      updateClipNumbers();
      renderEmptyMessage();
    }

    function addClip(clip = {}) {
      removeEmptyMessage();

      const element = document.createElement("div");
      element.className = "clip";

      element.innerHTML = `
        <div class="clip-header">
          <h3>Clip</h3>
          <button type="button" class="danger remove-button">
            Remove
          </button>
        </div>

        <div class="clip-grid">
          <div class="field">
            <label>File</label>
            <input
              data-field="file"
              type="text"
              placeholder="20260912/GX010017.MP4"
            />
          </div>

          <div class="field">
            <label>Start</label>
            <input
              data-field="start"
              type="number"
              step="0.001"
              min="0"
            />
          </div>

          <div class="field">
            <label>End</label>
            <input
              data-field="end"
              type="number"
              step="0.001"
              min="0"
            />
          </div>

          <div class="field">
            <label>Label</label>
            <input
              data-field="label"
              type="text"
              placeholder="Optional label"
            />
          </div>
        </div>
      `;

      element.querySelector('[data-field="file"]').value =
        clip.file ?? "";

      element.querySelector('[data-field="start"]').value =
        clip.start ?? 0;

      element.querySelector('[data-field="end"]').value =
        clip.end ?? 0;

      element.querySelector('[data-field="label"]').value =
        clip.label ?? "";

      element
        .querySelector(".remove-button")
        .addEventListener("click", () => {
          element.remove();
          updateClipNumbers();
          renderEmptyMessage();
        });

      clipsContainer.appendChild(element);

      updateClipNumbers();
    }

    function updateClipNumbers() {
      document.querySelectorAll(".clip").forEach((clip, index) => {
        clip.querySelector("h3").textContent = `Clip ${index + 1}`;
      });
    }

    function renderEmptyMessage() {
      if (document.querySelectorAll(".clip").length === 0) {
        clipsContainer.innerHTML = `
          <div class="empty" id="emptyMessage">
            No clips yet.
          </div>
        `;
      }
    }

    function removeEmptyMessage() {
      const empty = document.getElementById("emptyMessage");

      if (empty) {
        empty.remove();
      }
    }

    function downloadConfig() {
      const config = readConfigFromPage();

      const json = JSON.stringify(config, null, 2);

      const blob = new Blob([json], {
        type: "application/json"
      });

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = originalFilename;
      link.click();

      URL.revokeObjectURL(url);

      status.textContent = `Downloaded ${originalFilename}`;
    }

    fileInput.addEventListener("change", async (event) => {
      const file = event.target.files[0];

      if (!file) {
        return;
      }

      try {
        const text = await file.text();
        const config = JSON.parse(text);

        if (!Array.isArray(config.clips)) {
          throw new Error("JSON does not contain a clips array.");
        }

        originalFilename = file.name;

        loadConfig(config);

        status.textContent =
          `${file.name} · ${config.clips.length} clips`;
      } catch (error) {
        alert(`Could not load file:\n\n${error.message}`);
      }

      fileInput.value = "";
    });

    document
      .getElementById("addClipButton")
      .addEventListener("click", () => {
        addClip({
          file: "",
          start: 0,
          end: 3,
          label: ""
        });
      });

    document
      .getElementById("downloadButton")
      .addEventListener("click", downloadConfig);

    document
      .getElementById("newButton")
      .addEventListener("click", () => {
        originalFilename = "video-config.json";

        loadConfig(createEmptyConfig());

        status.textContent = "New config";
      });

    loadConfig(createEmptyConfig());
  </script>
</body>
</html>
